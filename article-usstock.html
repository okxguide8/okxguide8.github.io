<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 欧易 OKX 与币安 Binance 直购美股教程</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* 語言切換按鈕樣式 */
        .lang-switcher { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; }
        .lang-btn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; color: #475569; }
        .lang-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: bold; }
        
        h1 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        h2 { color: #0f172a; margin-top: 30px; }
        .box { background: #f8fafc; border-left: 4px solid #3b82f6; padding: 15px; margin: 20px 0; border-radius: 4px; }
        .btn-container { margin: 25px 0; display: flex; gap: 15px; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 12px 24px; color: #fff; background-color: #2563eb; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .btn-okx { background-color: #000; }
        .btn-binance { background-color: #f0b90b; color: #000; }
        code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #d97706; }
    </style>
</head>
<body>

    <!-- 語言切換按鈕區域 -->
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="switchLang('zh-CN')">简体中文</button>
        <button class="lang-btn" onclick="switchLang('zh-TW')">繁體中文</button>
        <button class="lang-btn" onclick="switchLang('en')">English</button>
    </div>

    <!-- 頁面標題與內容 -->
    <h1 id="title"></h1>
    <p id="intro"></p>

    <div class="box">
        <h3 id="why-title"></h3>
        <ul>
            <li id="why-1"></li>
            <li id="why-2"></li>
            <li id="why-3"></li>
        </ul>
    </div>

    <h2 id="platform1-title"></h2>
    <p id="platform1-desc"></p>

    <h2 id="platform2-title"></h2>
    <p id="platform2-desc"></p>

    <h2 id="bonus-title"></h2>
    <p id="bonus-desc"></p>

    <!-- 註冊按鈕區（自動讀取 JSON 中的鏈接與邀請碼） -->
    <div class="btn-container" id="dynamic-buttons">
        <!-- JS 會自動在這里渲染 OKX 和 Binance 的按鈕 -->
    </div>

    <script>
        // 全局變量存儲 JSON 數據與當前語言
        let siteConfig = null;
        let currentLang = localStorage.getItem('preferred_lang') || 'zh-CN';

        // 多語言文本字典
        const i18n = {
            'zh-CN': {
                title: '🚀 告别繁琐出入金！如何用 USDT/USDC 在欧易与币安 7x24h 买美股？',
                intro: '想布局特斯拉（TSLA）、英伟达（NVDA）、苹果（AAPL）或标普 500（SPY），却卡在传统美股券商<strong>出入金困难、电汇手续费高、审核繁琐</strong>的环节？现在，直接用手中的加密货币（USDT / USDC），就能在欧易（OKX）和币安（Binance）一键交易全球核心美股！',
                whyTitle: '💡 为什么选择在加密交易所买美股？',
                why1: '<strong>零出入金门槛</strong>：无需开立境外银行卡，直接用交易账户里的 USDT / USDC 下单。',
                why2: '<strong>7×24 小时全天候交易</strong>：不受美股传统开盘时间限制，周末和深夜随时建仓、平仓。',
                why3: '<strong>零碎股起投</strong>：几美元就能买英伟达，大幅降低散户配置美股巨头的资金门槛。',
                platform1Title: '🛠️ 平台一：欧易（OKX）—— 统一代币化股票（xStocks）',
                platform1Desc: '极其适合新手，统一账户无需复杂划转，支持 7×24 小时交易，直接用 USDT 计价。',
                platform2Title: '🛠️ 平台二：币安（Binance）—— 股票代币与资产配置',
                platform2Desc: '深度极佳，提供 1:1 锚定的股票资产通道，大资金低滑点。',
                bonusTitle: '🎁 读者专属注册福利与通道',
                bonusDesc: '通过下方专属链接注册并完成首笔交易，即可自动激活<strong>永久交易手续费减免优惠</strong>：'
            },
            'zh-TW': {
                title: '🚀 告別繁瑣出入金！如何用 USDT/USDC 在歐易與幣安 7x24h 買美股？',
                intro: '想布局特斯拉（TSLA）、英偉達（NVDA）、蘋果（AAPL）或標普 500（SPY），卻卡在傳統美股券商<strong>出入金困難、電匯手續費高、審核繁瑣</strong>的環節？現在，直接用手中的加密貨幣（USDT / USDC），就能在歐易（OKX）和幣安（Binance）一鍵交易全球核心美股！',
                whyTitle: '💡 為什麼選擇在加密交易所買美股？',
                why1: '<strong>零出入金門檻</strong>：無需開立境外銀行卡，直接用交易賬戶里的 USDT / USDC 下單。',
                why2: '<strong>7×24 小時全天候交易</strong>：不受美股傳統開盤時間限制，周末和深夜隨時建倉、平倉。',
                why3: '<strong>零碎股起投</strong>：幾美元就能買英偉達，大幅降低散戶配置美股巨頭的資金門檻。',
                platform1Title: '🛠️ 平台一：歐易（OKX）—— 統一代幣化股票（xStocks）',
                platform1Desc: '極其適合新手，統一賬戶無需複雜劃轉，支持 7×24 小時交易，直接用 USDT 計價。',
                platform2Title: '🛠️ 平台二：幣安（Binance）—— 股票代幣與資產配置',
                platform2Desc: '深度極佳，提供 1:1 錨定的股票資產通道，大資金低滑點。',
                bonusTitle: '🎁 讀者專屬註冊福利與通道',
                bonusDesc: '通過下方專屬鏈接註冊並完成首筆交易，即可自動激活<strong>永久交易手續費減免優惠</strong>：'
            },
            'en': {
                title: '🚀 How to Buy US Stocks 24/7 via OKX & Binance with USDT/USDC',
                intro: 'Want to invest in TSLA, NVDA, AAPL, or SPY without banking restrictions? Learn how to trade US stock tokens directly with USDT or USDC on OKX and Binance.',
                whyTitle: '💡 Why Trade US Stocks via Crypto Exchanges?',
                why1: '<strong>No Banking Hassles</strong>: Trade directly using USDT/USDC without overseas bank accounts.',
                why2: '<strong>24/7 Trading</strong>: Market hours don’t limit you. Buy or sell anytime.',
                why3: '<strong>Fractional Shares</strong>: Start investing with as little as a few dollars.',
                platform1Title: '🛠️ Platform 1: OKX — Tokenized Stocks (xStocks)',
                platform1Desc: 'Beginner-friendly, single unified account, priced directly in USDT.',
                platform2Title: '🛠️ Platform 2: Binance — Stock Tokens',
                platform2Desc: 'High liquidity, 1:1 backed asset exposure, low slippage.',
                bonusTitle: '🎁 Exclusive Referral Benefits',
                bonusDesc: 'Register via the links below to automatically unlock <strong>lifetime trading fee discounts</strong>:'
            }
        };

        // 頁面加載時先獲取 JSON 數據
        async function initPage() {
            try {
                const response = await fetch('config.json');
                siteConfig = await response.json();
            } catch (e) {
                console.error('無法載入 config.json，將使用備用鏈接', e);
            }
            switchLang(currentLang);
        }

        function switchLang(lang) {
            currentLang = lang;
            localStorage.setItem('preferred_lang', lang);
            
            // 更新按鈕高亮狀態
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const btnIndex = lang === 'zh-CN' ? 0 : (lang === 'zh-TW' ? 1 : 2);
            document.querySelectorAll('.lang-btn')[btnIndex].classList.add('active');

            // 填充文本
            const t = i18n[lang];
            document.getElementById('title').innerHTML = t.title;
            document.getElementById('intro').innerHTML = t.intro;
            document.getElementById('why-title').innerHTML = t.whyTitle;
            document.getElementById('why-1').innerHTML = t.why1;
            document.getElementById('why-2').innerHTML = t.why2;
            document.getElementById('why-3').innerHTML = t.why3;
            document.getElementById('platform1-title').innerHTML = t.platform1Title;
            document.getElementById('platform1-desc').innerHTML = t.platform1Desc;
            document.getElementById('platform2-title').innerHTML = t.platform2Title;
            document.getElementById('platform2-desc').innerHTML = t.platform2Desc;
            document.getElementById('bonus-title').innerHTML = t.bonusTitle;
            document.getElementById('bonus-desc').innerHTML = t.bonusDesc;

            // 動態生成註冊按鈕（鏈接與邀請碼完全由 JSON 驅動）
            renderButtons();
        }

        function renderButtons() {
            const container = document.getElementById('dynamic-buttons');
            container.innerHTML = '';

            // 如果 JSON 讀取成功，從 JSON 中取數據；若失敗則提供安全備用
            const okxData = siteConfig ? siteConfig.okx : { name: "欧易 OKX", code: "N4LJDJWM", link: "https://www.mitnpkwxvfr.com/join/N4LJDJWM" };
            const binanceData = siteConfig ? siteConfig.binance : { name: "币安 Binance", code: "ZV2BH3A6", link: "https://www.binance.com/zh-CN/register?ref=ZV2BH3A6" };

            // 根據不同語言調整按鈕文字
            let okxText = currentLang === 'en' ? `Sign Up ${okxData.name} (Code: ${okxData.code})` : `注册 ${okxData.name}（邀请码：${okxData.code}）`;
            let binanceText = currentLang === 'en' ? `Sign Up ${binanceData.name} (Code: ${binanceData.code})` : `注册 ${binanceData.name}（邀请码：${binanceData.code}）`;

            if (currentLang === 'zh-TW') {
                okxText = `註冊 ${okxData.name}（邀請碼：${okxData.code}）`;
                binanceText = `註冊 ${binanceData.name}（邀請碼：${binanceData.code}）`;
            }

            // 創建 OKX 按鈕
            const okxBtn = document.createElement('ahref' in window ? 'a' : 'a');
            okxBtn.href = okxData.link;
            okxBtn.target = '_blank';
            okxBtn.className = 'btn btn-okx';
            okxBtn.innerText = okxText;
            container.appendChild(okxBtn);

            // 創建 Binance 按鈕
            const binanceBtn = document.createElement('a');
            binanceBtn.href = binanceData.link;
            binanceBtn.target = '_blank';
            binanceBtn.className = 'btn btn-binance';
            binanceBtn.innerText = binanceText;
            container.appendChild(binanceBtn);
        }

        // 頁面啟動
        window.onload = initPage;
    </script>
</body>
</html>
