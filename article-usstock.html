                why1: '<strong>No Banking Hassles</strong>: Trade directly using USDT/USDC without overseas bank accounts.',
                why2: '<strong>24/7 Trading</strong>: Market hours don’t limit you. Buy or sell anytime.',
                why3: '<strong>Fractional Shares</strong>: Start investing with as little as a few dollars.',

                platform1Desc: 'Beginner-friendly, single unified account, priced directly in USDT.',
                platform2Title: '🛠️ Platform 2: Binance — Stock Tokens',
                platform2Desc: 'High liquidity, 1:1 backed asset exposure, low slippage.',
                bonusTitle: '🎁 Recommended Direct Access Links',

        async function initPage() {
            try {
                const response = await fetch('config.json');
                siteConfig = await response.json();
            } catch (e) {
                console.warn('读取外部 config.json 失败，改用内置完整配置', e);
                siteConfig = fallbackConfig;
            }
            renderNav();
            switchLang(currentLang);
        }

        function renderNav() {
            const navContainer = document.getElementById('dynamic-nav');
            if (!navContainer || !siteConfig.nav) return;
            navContainer.innerHTML = '';
            siteConfig.nav.forEach(item => {
                const a = document.createElement('a');
                a.href = item.url;
                a.innerText = item.name;
                navContainer.appendChild(a);
            });
        }

        function switchLang(lang) {
            currentLang = lang;
            localStorage.setItem('preferred_lang', lang);
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const btnIndex = lang === 'zh-CN' ? 0 : (lang === 'zh-TW' ? 1 : 2);
            document.querySelectorAll('.lang-btn')[btnIndex].classList.add('active');

            const t = i18n[lang];
            document.getElementById('title').innerHTML = t.title;
            document.getElementById('intro').innerHTML = t.intro;
            document.getElementById('why-title').innerHTML = t.whyTitle;
            document.getElementById('why-1').innerHTML = t.why1;
            document.getElementById('why-2').innerHTML = t.why2;
            document.getElementById('why-3').innerHTML = t.why3;
            document.getElementById('platform1-title').innerHTML = t.platform1Title;
            document.getElementById('platform1-desc').innerHTML = t.platform1Desc;
            document.getElementById('platform2-title').innerHTML = t.platform2Title;
            document.getElementById('platform2-desc').innerHTML = t.platform2Desc;
            document.getElementById('bonus-title').innerHTML = t.bonusTitle;
            document.getElementById('bonus-desc').innerHTML = t.bonusDesc;
            document.getElementById('all-ex-title').innerHTML = t.allExTitle;
            document.getElementById('all-ex-desc').innerHTML = t.allExDesc;

            renderAllExchanges();
        }

        function renderAllExchanges() {
            const t = i18n[currentLang];
            const cfg = siteConfig || fallbackConfig;

            // 1. 渲染美股推荐的两个主按钮 (OKX + Binance)
            const featuredContainer = document.getElementById('featured-buttons');
            featuredContainer.innerHTML = '';
            
            const okxData = cfg.okx;
            const binanceData = cfg.binance;

            if (okxData) {
                const a = document.createElement('a');
                a.href = okxData.link;
                a.target = '_blank';
                a.className = 'btn-main btn-okx';
                a.innerText = currentLang === 'en' ? `Sign Up ${okxData.name} (${okxData.code})` : `注册 ${okxData.name}（邀请码：${okxData.code}）`;
                featuredContainer.appendChild(a);
            }

            if (binanceData) {
                const a = document.createElement('a');
                a.href = binanceData.link;
                a.target = '_blank';
                a.className = 'btn-main btn-binance';
                a.innerText = currentLang === 'en' ? `Sign Up ${binanceData.name} (${binanceData.code})` : `注册 ${binanceData.name}（邀请码：${binanceData.code}）`;
                featuredContainer.appendChild(a);
            }

            // 2. 渲染全量 6 交易所网格 (OKX, Binance, Gate, HTX, Bitget, Bybit)
            const gridContainer = document.getElementById('all-ex-grid');
            gridContainer.innerHTML = '';

            const exKeys = ['okx', 'binance', 'gate', 'htx', 'bitget', 'bybit'];
            
            exKeys.forEach(key => {
                const item = cfg[key];
                if (!item) return;

                const card = document.createElement('div');
                card.className = 'ex-card';

                card.innerHTML = `
                    <div>
                        <div class="ex-header">
                            <span class="ex-name">${item.name}</span>
                            <span class="ex-badge">${item.badge}</span>
                        </div>
                        <div class="ex-desc">${item.desc}</div>
                    </div>
                    <a href="${item.link}" target="_blank" class="ex-btn">${t.registerText} (${item.code})</a>
                `;
                gridContainer.appendChild(card);
            });
        }
