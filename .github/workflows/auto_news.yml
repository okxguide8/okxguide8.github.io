name: Auto Generate Crypto News

on:
  schedule:
    # 每天北京时间早上 8:00 和晚上 8:00 自动运行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支持手动点击按钮立即运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 运行快讯采集脚本
        run: |
          python generate_news.py

      - name: 提交并推送到仓库
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/okxguide8/okxguide8.github.io.git
          git add .
          git commit -m "🤖 自动更新今日币圈快讯 [skip ci]" || exit 0
          git push origin main
